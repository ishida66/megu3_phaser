<script>
// Keep the splash visible until both its image and the game's initial scene/load batch are ready.
window.__meguSplashGate = (() => {
  const root = document.getElementById('initial-splash-screen');
  const image = document.getElementById('initial-splash-image');
  const fallback = document.getElementById('initial-splash-fallback');
  let imageSettled = false;
  let gameReady = false;
  let removed = false;
  const tryRemove = () => {
    if (removed || !imageSettled || !gameReady || !root) return;
    removed = true;
    root.classList.add('is-hiding');
    window.setTimeout(() => { if (root.isConnected) root.remove(); }, 180);
  };
  const settleImage = success => {
    if (imageSettled) return;
    imageSettled = true;
    if (!success) {
      if (image) image.hidden = true;
      if (fallback) fallback.hidden = false;
    }
    tryRemove();
  };
  if (image) {
    image.addEventListener('load', () => settleImage(true), { once: true });
    image.addEventListener('error', () => settleImage(false), { once: true });
    if (image.complete) settleImage(image.naturalWidth > 0);
  } else {
    settleImage(false);
  }
  return { markGameReady() { gameReady = true; tryRemove(); } };
})();
</script>
<script>
// MEGU environment selection. localhost/file:// uses the development Supabase
// project; deployed hosts (including GitHub Pages) use production.
// Replace the four placeholders with the URL and anon/publishable key from
// the matching Supabase project. Never put a service-role key in this file.
window.MEGU_ENVIRONMENT = (() => {
  const host = String(location.hostname || '').toLowerCase();
  const isPrivateIPv4 = (() => {
    const parts = host.split('.').map(Number);
    if (parts.length !== 4 || parts.some(n => !Number.isInteger(n) || n < 0 || n > 255)) return false;
    return parts[0] === 10 || parts[0] === 127 ||
      (parts[0] === 172 && parts[1] >= 16 && parts[1] <= 31) ||
      (parts[0] === 192 && parts[1] === 168);
  })();
  const isLocalHost = host === 'localhost' || host === '::1' || host.endsWith('.local') || isPrivateIPv4;
  return location.protocol === 'file:' || isLocalHost ? 'development' : 'production';
})();
window.MEGU_BACKEND_CONFIGS = Object.freeze({
  development: Object.freeze({
    supabaseUrl: 'https://dpztbnkuuforlsotbgdb.supabase.co',
    supabaseAnonKey: 'sb_publishable_BrKE75EUYWiOXUslbvVsKg_2xg1fNfX'
  }),

    supabaseAnonKey: 'sb_publishable_OWyCDAlMwLeWump7MBiHdA_8f9Ve0a4'
  })
});
window.MEGU_BACKEND_CONFIG = window.MEGU_BACKEND_CONFIGS[window.MEGU_ENVIRONMENT];
window.MEGU_BACKEND_CONFIGURED =
  /^https:\/\/[^/]+\.supabase\.co$/i.test(window.MEGU_BACKEND_CONFIG.supabaseUrl) &&

<script>
// Force fresh asset URLs for every page/game launch. Phaser keeps its own
// in-memory textures while a page is running, but this unique URL token makes
// the browser request current PNG/JSON/audio files instead of reusing HTTP cache.
(() => {
  const launchToken = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
  const withFreshAssetURL = value => {
    if (typeof value !== 'string' || !value || /^(data:|blob:|javascript:)/i.test(value) || /[?&]__megu_reload=/.test(value)) return value;
    // Leave external libraries and non-local URLs alone; apply to game assets.
    if (/^(https?:)?\/\//i.test(value) && !/^(https?:)?\/\/(localhost|127\.0\.0\.1)(:\d+)?\//i.test(value)) return value;
    const hashAt = value.indexOf('#');
    const hash = hashAt >= 0 ? value.slice(hashAt) : '';
    const withoutHash = hashAt >= 0 ? value.slice(0, hashAt) : value;
    const separator = withoutHash.includes('?') ? '&' : '?';
    return `${withoutHash}${separator}__megu_reload=${encodeURIComponent(launchToken)}${hash}`;
  };

  // Intercept Phaser's central file queue so direct and dynamically requested
  // atlases, spritesheets, JSON, images and audio all get the same cache-buster.
  const loaderProto = Phaser.Loader.LoaderPlugin.prototype;
  if (!loaderProto.__meguFreshAssetPatch && typeof loaderProto.addFile === 'function') {
    const originalAddFile = loaderProto.addFile;
    const patchFile = (file, seen = new Set()) => {
      if (!file || (typeof file !== 'object' && typeof file !== 'function') || seen.has(file)) return;
      seen.add(file);
      ['url', 'textureURL', 'imageURL', 'atlasURL', 'normalMapURL'].forEach(prop => {
        if (typeof file[prop] === 'string') file[prop] = withFreshAssetURL(file[prop]);
      });
      if (Array.isArray(file.files)) file.files.forEach(child => patchFile(child, seen));
      if (file.config && typeof file.config === 'object') {
        ['url', 'textureURL', 'imageURL', 'atlasURL', 'normalMapURL'].forEach(prop => {
          if (typeof file.config[prop] === 'string') file.config[prop] = withFreshAssetURL(file.config[prop]);
        });
      }
    };
    loaderProto.addFile = function (file) {
      if (Array.isArray(file)) file.forEach(item => patchFile(item));
      else patchFile(file);
      return originalAddFile.apply(this, arguments);
    };
    Object.defineProperty(loaderProto, '__meguFreshAssetPatch', { value: true });
  }

  // The splash is outside Phaser's loader, so give it a fresh URL too.
  const splash = document.getElementById('initial-splash-image');
  if (splash) splash.src = withFreshAssetURL(splash.getAttribute('src'));
})();
</script>

<!-- MEGU memory diagnostics: development-only overlay, no gameplay changes. -->
<script>
(() => {
  'use strict';
  const formatBytes = value => {
    if (!Number.isFinite(value)) return 'n/a';
    const units = ['B', 'KB', 'MB', 'GB'];
    let n = value, i = 0;
    while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
    return `${n.toFixed(i === 0 ? 0 : 2)} ${units[i]}`;
  };
  const panel = document.createElement('pre');
  panel.id = 'megu-memory-debug-panel';
  Object.assign(panel.style, {
    position: 'fixed', right: '8px', top: '8px', zIndex: '200000',
    display: 'none', width: 'min(440px, calc(100vw - 16px))', maxHeight: '65vh',
    overflow: 'auto', margin: '0', padding: '10px 12px', boxSizing: 'border-box',
    border: '1px solid #8fa6c8', borderRadius: '8px', background: 'rgba(8,14,25,.92)',
    color: '#d9f2ff', font: '11px/1.45 Consolas, monospace', whiteSpace: 'pre-wrap',
    pointerEvents: 'none', textShadow: 'none'
  });
  panel.textContent = 'MEGU memory diagnostics\nWaiting for Phaser…\nPress F3 to show/hide';
  document.body.appendChild(panel);

  const collect = () => {
    const game = window.game;
    if (!game || !game.scene || !game.textures) return { ready: false };
    const allScenes = game.scene.scenes || [];
    const referencedTextures = new Map();
    let activeObjects = 0, allObjects = 0;
    const visit = (obj, sceneKey, active) => {
      if (!obj) return;
      allObjects++;
      if (active) activeObjects++;
      if (obj.texture && obj.texture.key) {
        const key = obj.texture.key;
        if (!referencedTextures.has(key)) referencedTextures.set(key, { active: 0, total: 0, scenes: new Set() });
        const record = referencedTextures.get(key);
        record.total++;
        if (active) record.active++;
        record.scenes.add(sceneKey);
      }
      if (typeof obj.getChildren === 'function') {
        const children = obj.getChildren();
        if (Array.isArray(children)) children.forEach(child => visit(child, sceneKey, active));
      }
    };
    const activeSceneNames = [];
    allScenes.forEach(scene => {
      const active = !!(scene.sys && scene.sys.isActive());
      if (active) activeSceneNames.push(scene.scene.key);
      const list = scene.children && scene.children.getChildren ? scene.children.getChildren() : [];
      list.forEach(obj => visit(obj, scene.scene.key, active));
    });

    const textureEntries = Object.values(game.textures.list || {});
    let estimatedTextureBytes = 0, textureSources = 0;
    const textureRows = [];
    textureEntries.forEach(texture => {
      if (!texture || texture.key === '__DEFAULT' || texture.key === '__MISSING') return;
      let bytes = 0, dimensions = [];
      const sources = texture.source || [];
      sources.forEach(source => {
        const image = source && (source.image || source);
        const w = image && (image.naturalWidth || image.videoWidth || image.width || image.displayWidth);
        const h = image && (image.naturalHeight || image.videoHeight || image.height || image.displayHeight);
        if (w > 0 && h > 0) { bytes += w * h * 4; dimensions.push(`${w}x${h}`); textureSources++; }
      });
      estimatedTextureBytes += bytes;
      const refs = referencedTextures.get(texture.key);
      textureRows.push({ key: texture.key, bytes, dimensions: dimensions.join(','), refs: refs ? refs.total : 0, activeRefs: refs ? refs.active : 0 });
    });
    const orphanCandidates = textureRows.filter(row => row.refs === 0 && row.bytes > 0).sort((a,b) => b.bytes-a.bytes);
    const textureTop = textureRows.slice().sort((a,b) => b.bytes-a.bytes).slice(0, 12);

    let audioKeys = [];
    try {
      const entries = game.cache && game.cache.audio && game.cache.audio.entries && game.cache.audio.entries.entries;
      if (entries && typeof entries.keys === 'function') audioKeys = Array.from(entries.keys());
    } catch (_) {}
    const sounds = game.sound && Array.isArray(game.sound.sounds) ? game.sound.sounds : [];
    const activeSounds = sounds.filter(sound => sound && (sound.isPlaying || sound.isPaused)).length;
    const canvas = game.canvas;
    const canvasBytes = canvas ? canvas.width * canvas.height * 4 : 0;
    const perf = performance.memory || null;
    return {
      ready: true,
      time: new Date().toLocaleTimeString(),
      heapUsed: perf ? perf.usedJSHeapSize : null,
      heapTotal: perf ? perf.totalJSHeapSize : null,
      heapLimit: perf ? perf.jsHeapSizeLimit : null,
      textureCount: textureRows.length,
      textureBytes: estimatedTextureBytes,
      textureSources,
      orphanCandidates,
      textureTop,
      audioCount: audioKeys.length,
      audioKeys,
      soundInstances: sounds.length,
      activeSounds,
      activeSceneNames,
      sceneCount: allScenes.length,
      activeObjects,
      allObjects,
      canvasBytes,
      canvasWidth: canvas ? canvas.width : 0,
      canvasHeight: canvas ? canvas.height : 0
    };
  };

  const render = data => {
    if (!data.ready) { panel.textContent = 'MEGU memory diagnostics\nWaiting for Phaser…\nPress F3 to show/hide'; return; }
    const heap = data.heapUsed == null ? 'unavailable (browser does not expose performance.memory)' : `${formatBytes(data.heapUsed)} used / ${formatBytes(data.heapTotal)} allocated / ${formatBytes(data.heapLimit)} limit`;
    const lines = [
      `MEGU MEMORY DIAGNOSTICS  ${data.time}  (F3 toggle, console: MEGU_MEMORY_DEBUG.dump())`,
      `JS heap: ${heap}`,
      `Phaser textures: ${data.textureCount} | decoded RGBA estimate: ${formatBytes(data.textureBytes)} (${data.textureSources} source images)`,
      `Canvas: ${data.canvasWidth}x${data.canvasHeight} | ${formatBytes(data.canvasBytes)} RGBA buffer estimate`,
      `Audio cache: ${data.audioCount} files | sound instances: ${data.soundInstances} (${data.activeSounds} playing/paused)`,
      `Scenes active: ${data.activeSceneNames.join(', ') || 'none'} | registered scenes: ${data.sceneCount}`,
      `Display objects: ${data.activeObjects} active-scene / ${data.allObjects} all-scenes`,
      `Unreferenced texture candidates: ${data.orphanCandidates.length} | ${formatBytes(data.orphanCandidates.reduce((n,x)=>n+x.bytes,0))}`,
      'Largest cached textures:'
    ];
    data.textureTop.forEach(row => lines.push(`  ${row.key}: ${row.dimensions || '?'} ${formatBytes(row.bytes)} | refs ${row.refs} (active ${row.activeRefs})`));
    if (data.orphanCandidates.length) {
      lines.push('Possible cache leftovers (not auto-deleted; may be intentionally preloaded):');
      data.orphanCandidates.slice(0, 12).forEach(row => lines.push(`  ${row.key}: ${row.dimensions || '?'} ${formatBytes(row.bytes)}`));
    }
    lines.push('Note: texture figures are decoded RGBA estimates, not exact GPU/RAM usage. Audio decoded memory is browser-managed and not measured.');
    panel.textContent = lines.join('\n');
  };

  let lastSnapshot = null;
  const snapshot = () => { lastSnapshot = collect(); render(lastSnapshot); return lastSnapshot; };
  const dump = () => {
    const data = snapshot();
    console.group('[MEGU memory diagnostics]');
    console.log('Snapshot:', data);
    if (data.ready) {
      console.table(data.textureTop);
      console.warn('Unreferenced texture candidates (review before removal; some may be intentionally cached):', data.orphanCandidates);
      console.log('Audio cache keys:', data.audioKeys);
    }
    console.groupEnd();
    return data;
  };
  window.MEGU_MEMORY_DEBUG = { snapshot, dump, show: () => { panel.style.display = 'block'; snapshot(); }, hide: () => { panel.style.display = 'none'; }, get lastSnapshot() { return lastSnapshot; } };

  document.addEventListener('keydown', event => {
    if (event.key === 'F3') {
      event.preventDefault();
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
      if (panel.style.display !== 'none') snapshot();
    }
  });
  setInterval(() => { if (panel.style.display !== 'none') snapshot(); }, 5000);
  setTimeout(() => { if (panel.style.display !== 'none') snapshot(); }, 1000);
  console.info('[MEGU] Memory diagnostics loaded. Press F3 or call MEGU_MEMORY_DEBUG.dump().');
})();
</script>
</body>
</html>
